<!DOCTYPE html>
<html>

<head>
  <!-- Meta Info -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="zharnite" />
  <meta name="description" content="Hi, I'm zharnite! A software engineer and 3D hobbyist." />
  <meta name="designer" content="zharnite" />
  <meta name="keywords" content="zharnite" />
  <meta name="theme-color" content="#ffffff" />

  <!-- Title -->
  <title>zharnite</title>
  <link rel="apple-touch-icon" sizes="192x192" href="images/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png" />
  <link rel="icon" type="image/x-icon" href="images/favicon.ico" />
  <link rel="manifest" href="images/site.webmanifest" />

  <!-- Resolve the stored world before first paint, so the ink and the
       fallback gradient are never briefly from the wrong world. -->
  <script>
    (function () {
      var ids = ['none', 'steampunk', 'station', 'old-tv'];
      var id = 'none';
      try {
        var v = localStorage.getItem('zharnite.world');
        if (ids.indexOf(v) >= 0) id = v;
      } catch (e) { /* blocked storage: keep the default */ }

      // A visitor who has asked their browser to save data, or is on a very
      // slow connection, gets the plain page even if they chose a wallpaper
      // last time. The menu is still there if they want one anyway.
      var c = navigator.connection;
      if (c && (c.saveData || /(^|-)2g$/.test(c.effectiveType || ''))) {
        id = 'none';
        document.documentElement.setAttribute('data-lite', '');
      }
      document.documentElement.setAttribute('data-theme', id);

      // Wallpapers that have a time of day: day uses dark ink, so that has to
      // be known before first paint too.
      if (id === 'steampunk' || id === 'station') {
        var time = 'dusk';
        try {
          var t = localStorage.getItem('zharnite.time');
          if (t === 'day' || t === 'night') time = t;
        } catch (e) { /* keep dusk */ }
        document.documentElement.setAttribute('data-time', time);
      }
    })();
  </script>

  <!-- Styles -->
  <link rel="stylesheet" href="styles/skeleton.css" />
  <link rel="stylesheet" href="styles/style.css" />

  <!-- Web fonts, loaded without holding up the page: the stylesheet is
       fetched as if for print, which does not block, and switched on when it
       arrives. Until then the text shows in the system's monospace face. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Limelight&amp;family=Share+Tech+Mono&amp;display=swap" media="print" onload="this.media='all'" />
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Limelight&amp;family=Share+Tech+Mono&amp;display=swap" />
  </noscript>

  <!-- Three.js, pinned. The internal ./three.core.min.js import resolves
       relatively against the same CDN directory, so one entry is enough. -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.min.js"
      }
    }
  </script>

  <!-- The page's own scripts, fetched together and not one after another.
       These come after the import map: a browser stops accepting an import
       map once it has started loading modules. -->
  <link rel="modulepreload" href="scripts/main.js" />
  <link rel="modulepreload" href="scripts/themes.js" />
  <link rel="modulepreload" href="scripts/menu.js" />

  <!-- Font Awesome, for the two icons on the button. Deferred, so the page
       is drawn without waiting for it. -->
  <script defer src="https://kit.fontawesome.com/3d468919d3.js" crossorigin="anonymous"></script>
</head>

<body>
  <!-- 3D background. Fixed, behind everything, fades in on the first frame. -->
  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  <!-- Top bar. Fixed, so it never shifts the hero down and the worlds keep
       the composition they were tuned against. It holds the Wallpaper menu,
       which scripts/menu.js adds at its right. -->
  <header id="topbar">
    <div class="container"></div>
  </header>

  <div id="main-wrapper">
    <!-- Content -->
    <div id="main-content">
      <div class="container">
        <div class="row" id="content-row">
          <h1>Hi, I'm <span id="name">zharnite</span></h1>
          <p id="tagline">making something...</p>
          <a id="link-btn" href="https://linktr.ee/zharnite" class="button" target="_blank">Hobbies <i
              class="fa fa-link"></i><i class="fas fa-tree"></i>
          </a>
          <a id="blog-btn" href="blog/" class="button">Blog <i class="fas fa-pencil-alt"></i></a>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer id="main-footer">
      <div class="container">
        <p>
          &copy; 2022&ndash;present
          <a href="https://github.com/Zharnite/zharnite.github.io" target="_blank">zharnite</a>.
        </p>
      </div>
    </footer>
  </div>

  <script type="module" src="scripts/main.js"></script>

  <!-- Visitor counts, by GoatCounter. No cookies and nothing personal is
       kept, so it needs no consent banner. It does not count visits to a
       local copy of the site. -->
  <script data-goatcounter="https://zharnite.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>

</html>
