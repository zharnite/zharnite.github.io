# GitHub Pages builds the site with Jekyll on every push. Only files that
# start with front matter (the block between two --- lines) are processed;
# index.html, the scripts and the shaders are copied as they are.

title: zharnite
description: Hi, I'm zharnite! A software engineer and 3D hobbyist.

# A post's address is its file name without the date:
# _posts/2026-11-15-fried-rice.md  ->  /blog/fried-rice/
permalink: /blog/:title/

# Every post uses the post layout, so a post only has to state its title.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - README.md
  - .claude
